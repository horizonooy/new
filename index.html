<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta
    name="description"
    content="CHANDAN — Maison de Parfum. The art of leaving a trace."
  />

  <title>CHANDAN — Maison de Parfum</title>

  <!-- Luxury fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --sw-bg: #F5EDE0;
      --sw-ink: #241d2b;
      --sw-ink-soft: #6a6072;
      --sw-accent: #9B8CB8;

      --sw-font-display:
        "Cormorant Garamond",
        Georgia,
        serif;

      --sw-font-body:
        "Inter",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }
  </style>
</head>

<body>

  <!-- Main website -->
  <div id="world"></div>

  <!-- IMPORTANT:
       Keep scrub-engine.js exactly as it is -->
  <script src="scrub-engine.js"></script>

  <script>
    mountLetsScroll(document.getElementById("world"), {

      /* =====================================================
         BRAND
         ===================================================== */

      brand: {
        name: "CHANDAN",
        href: "#top"
      },

      cta: {
        label: "Discover Nº 1",
        href: "#finale"
      },

      hint: "scroll to enter the world of CHANDAN",

      nav: true,

      atmosphere: true,


      /* =====================================================
         IMPORTANT ENGINE SETTINGS
         ORIGINAL-STYLE SETTINGS
         ===================================================== */

      diveScroll: 1.3,

      connScroll: 0.9,

      crossfade: 0.08,

      connectors: [],


      /* =====================================================
         PERFUME JOURNEY
         ===================================================== */

      sections: [

        /* -------------------------------------------------
           01 — THE HARVEST
           ------------------------------------------------- */

        {
          id: "harvest",

          label: "The Harvest",

          still: "harvest.webp",

          clip: "harvest.mp4",

          accent: "#9B8CB8",

          scroll: 1.4,

          linger: 0.3,

          eyebrow: "THE ORIGIN",

          title: "Where every scent begins.",

          body:
            "Every CHANDAN fragrance begins with carefully selected ingredients, inspired by nature and refined with intention.",

          tags: [
            "Rare Botanicals",
            "Natural Ingredients",
            "Pure Essence"
          ]
        },


        /* -------------------------------------------------
           02 — THE ATELIER
           ------------------------------------------------- */

        {
          id: "atelier",

          label: "The Atelier",

          still: "atelier.webp",

          clip: "atelier.mp4",

          accent: "#B0703C",

          scroll: 1.4,

          linger: 0,

          eyebrow: "THE CRAFT",

          title: "The art of composition.",

          body:
            "Inside the atelier, precious notes are carefully blended into balanced compositions that reveal depth, warmth and character.",

          tags: [
            "Fine Perfumery",
            "Masterful Blending",
            "Signature Notes"
          ]
        },


        /* -------------------------------------------------
           03 — THE BOUTIQUE
           ------------------------------------------------- */

        {
          id: "boutique",

          label: "The Boutique",

          still: "boutique.webp",

          clip: "boutique.mp4",

          accent: "#D4AF6A",

          scroll: 1.4,

          linger: 0,

          eyebrow: "THE EXPERIENCE",

          title: "Luxury in every detail.",

          body:
            "From the first impression to the final touch, every detail is designed to make fragrance feel personal, refined and unforgettable.",

          tags: [
            "Luxury Design",
            "Signature Bottle",
            "Timeless Elegance"
          ]
        },


        /* -------------------------------------------------
           04 — CHANDAN Nº 1
           ------------------------------------------------- */

        {
          id: "finale",

          label: "CHANDAN Nº 1",

          still: "finale.webp",

          clip: "finale.mp4",

          accent: "#C9892F",

          scroll: 1.7,

          linger: 0.45,

          eyebrow: "THE SIGNATURE",

          title: "CHANDAN Nº 1",

          body:
            "A signature fragrance created to leave a quiet, unforgettable trace. Warm, elegant and unmistakably CHANDAN.",

          tags: [
            "Signature Fragrance",
            "Elegant",
            "Unforgettable"
          ],

          cta: {
            primary: {
              label: "Discover Nº 1",
              href: "#"
            },

            secondary: {
              label: "The Maison",
              href: "#"
            }
          }
        }

      ]
    });
  </script>

</body>
</html>
