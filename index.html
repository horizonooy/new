<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>SILLAGE — Maison de Parfum</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #080706;
    }

    body {
      overflow-x: hidden;
    }

    #world {
      width: 100%;
      min-height: 100vh;
    }
  </style>
</head>

<body>

  <!-- Main SILLAGE experience -->
  <main id="world"></main>

  <!-- SILLAGE Scroll Engine -->
  <script src="scrub-engine.js"></script>

  <script>

    mountLetsScroll(document.getElementById('world'), {

      /* =========================
         BRAND
      ========================== */

      brand: {
        name: 'SILLAGE',
        href: '#top'
      },

      /* =========================
         TOP CTA
      ========================== */

      cta: {
        label: 'Discover Nº 1',
        href: '#finale'
      },

      /* =========================
         EXPERIENCE SETTINGS
      ========================== */

      hint: 'scroll to begin the journey',

      diveScroll: 1.3,

      connScroll: 0.9,

      crossfade: 0.08,

      nav: true,

      atmosphere: true,


      /* =========================
         CONNECTORS
         
         Agar tumhare paas connector
         videos nahi hain to empty rakho.
      ========================== */

      connectors: [],

      connectorsMobile: [],


      /* =========================
         SECTIONS
      ========================== */

      sections: [

        /* =====================================
           01 — THE HARVEST
        ====================================== */

        {
          id: 'harvest',

          label: 'The Harvest',

          /*
            IMPORTANT:
            Files index.html ke same folder me hain.
            Isliye assets/ nahi lagaya.
          */

          still: 'harvest.webp',

          clip: 'harvest.mp4',

          accent: '#9B8CB8',

          scroll: 1.4,

          linger: 0.3,

          eyebrow: 'THE ORIGIN',

          title: 'Born from the earth.',

          body:
            'The journey begins where nature gives its first breath — among precious botanicals, harvested with patience and intention.',

          tags: [
            'Natural Ingredients',
            'Hand Harvested',
            'Rare Botanicals'
          ]
        },


        /* =====================================
           02 — THE ATELIER
        ====================================== */

        {
          id: 'atelier',

          label: 'The Atelier',

          still: 'atelier.webp',

          clip: 'atelier.mp4',

          accent: '#B0703C',

          scroll: 1.5,

          linger: 0.35,

          eyebrow: 'THE CRAFT',

          title: 'Where scent becomes art.',

          body:
            'Inside the atelier, master perfumers transform raw materials into a composition designed to leave an unforgettable trail.',

          tags: [
            'Master Perfumery',
            'Precision',
            'French Craft'
          ]
        },


        /* =====================================
           03 — THE BOUTIQUE
        ====================================== */

        {
          id: 'boutique',

          label: 'The Boutique',

          still: 'boutique.webp',

          clip: 'boutique.mp4',

          accent: '#D4AF6A',

          scroll: 1.5,

          linger: 0.35,

          eyebrow: 'THE EXPERIENCE',

          title: 'A world created for you.',

          body:
            'Every detail is considered — from the first impression to the final drop, an experience designed around the art of fragrance.',

          tags: [
            'Private Collection',
            'Signature Scent',
            'Maison Experience'
          ]
        },


        /* =====================================
           04 — Nº 1
        ====================================== */

        {
          id: 'finale',

          label: 'Nº 1',

          still: 'finale.webp',

          clip: 'finale.mp4',

          accent: '#C9892F',

          scroll: 1.7,

          linger: 0.45,

          eyebrow: 'SILLAGE Nº 1',

          title: 'Leave a trace.',

          body:
            'A signature fragrance created to stay long after you have left the room. Discover Nº 1 by SILLAGE.',

          tags: [
            'Eau de Parfum',
            'Signature Collection',
            'Nº 1'
          ],

          cta: {

            primary: {
              label: 'Discover Nº 1',
              href: '#'
            },

            secondary: {
              label: 'Explore the Maison',
              href: '#'
            }

          }

        }

      ]

    });

  </script>

</body>
</html>
