<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta
    name="description"
    content="CHANDAN — Maison de Parfum. A cinematic journey through the art of fragrance."
  />

  <meta
    name="theme-color"
    content="#EFE4D3"
  />

  <title>CHANDAN — Maison de Parfum</title>

  <!-- Luxury typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --brand-bg: #efe4d3;
      --brand-ink: #211b18;
      --brand-soft: #75675c;
      --brand-gold: #b88948;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--brand-bg);
      color: var(--brand-ink);
      overflow-x: hidden;
    }

    * {
      box-sizing: border-box;
    }

    /* Engine theme override */
    #world {
      --sw-bg: #efe4d3;
      --sw-ink: #211b18;
      --sw-ink-soft: #75675c;
      --sw-accent: #b88948;

      --sw-font-display:
        "Cormorant Garamond",
        Georgia,
        serif;

      --sw-font-body:
        "Inter",
        Arial,
        sans-serif;
    }

    /* Slightly more premium page feel */
    .brand-intro {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    /* Optional bottom copyright */
    .copyright {
      position: fixed;
      left: 22px;
      bottom: 18px;
      z-index: 45;

      font-family: "Inter", sans-serif;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;

      color: rgba(33, 27, 24, 0.48);
      pointer-events: none;
    }

    @media (max-width: 860px) {
      .copyright {
        left: 18px;
        bottom: 12px;
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <!-- Main cinematic experience -->
  <div id="world"></div>

  <!-- Small brand footer -->
  <div class="copyright">
    © 2026 CHANDAN — MAISON DE PARFUM
  </div>

  <!-- Your existing scroll engine -->
  <script src="scrub-engine.js"></script>

  <script>
    /*
      ============================================================
      CHANDAN — MAISON DE PARFUM
      Cinematic perfume website configuration
      ============================================================
    */

    mountLetsScroll(document.getElementById("world"), {

      /* --------------------------------------------------------
         BRAND
      -------------------------------------------------------- */

      brand: {
        name: "CHANDAN",
        href: "#top"
      },

      /* --------------------------------------------------------
         TOP CTA
      -------------------------------------------------------- */

      cta: {
        label: "Discover Nº 1",
        href: "#"
      },

      /* --------------------------------------------------------
         EXPERIENCE SETTINGS
      -------------------------------------------------------- */

      hint: "scroll to enter the world of CHANDAN",

      nav: true,

      atmosphere: true,

      diveScroll: 1.45,

      connScroll: 0.9,

      crossfade: 0.10,

      connectors: [],


      /* ========================================================
         PERFUME SECTIONS
         ======================================================== */

      sections: [

        /* ======================================================
           01 — THE HARVEST
        ====================================================== */

        {
          id: "harvest",

          label: "The Harvest",

          still: "harvest.webp",

          clip: "harvest.mp4",

          accent: "#8E7B68",

          scroll: 1.5,

          linger: 0.25,

          eyebrow: "01 · THE ORIGIN",

          title: "Where every scent begins.",

          body:
            "From sun-warmed botanicals to carefully chosen raw materials, CHANDAN begins with nature. Every ingredient is selected for the character it brings to the final composition.",

          tags: [
            "Natural Ingredients",
            "Rare Botanicals",
            "Carefully Selected"
          ]
        },


        /* ======================================================
           02 — THE ATELIER
        ====================================================== */

        {
          id: "atelier",

          label: "The Atelier",

          still: "atelier.webp",

          clip: "atelier.mp4",

          accent: "#A96F48",

          scroll: 1.55,

          linger: 0.35,

          eyebrow: "02 · THE CRAFT",

          title: "Composed with intention.",

          body:
            "Inside the atelier, contrasting notes become harmony. Floral, woody, warm and luminous accords are blended with patience to create a fragrance that feels distinctly CHANDAN.",

          tags: [
            "Masterfully Blended",
            "Modern Composition",
            "Fine Perfumery"
          ]
        },


        /* ======================================================
           03 — THE BOUTIQUE
        ====================================================== */

        {
          id: "boutique",

          label: "The Boutique",

          still: "boutique.webp",

          clip: "boutique.mp4",

          accent: "#C39A55",

          scroll: 1.55,

          linger: 0.30,

          eyebrow: "03 · THE EXPERIENCE",

          title: "Luxury, held in every detail.",

          body:
            "A fragrance is more than a bottle. It is an atmosphere, a memory and a quiet statement. CHANDAN brings together refined design and olfactory character for a complete sensory experience.",

          tags: [
            "Signature Bottle",
            "Refined Design",
            "Luxury Experience"
          ]
        },


        /* ======================================================
           04 — CHANDAN Nº 1
        ====================================================== */

        {
          id: "finale",

          label: "CHANDAN Nº 1",

          still: "finale.webp",

          clip: "finale.mp4",

          accent: "#B97832",

          scroll: 1.8,

          linger: 0.45,

          eyebrow: "04 · THE SIGNATURE",

          title: "CHANDAN Nº 1",

          body:
            "A signature expression of the Maison — warm, elegant and unforgettable. Created for those who leave a trace without saying a word.",

          tags: [
            "Signature Fragrance",
            "Long-Lasting Character",
            "CHANDAN"
          ],

          cta: {
            primary: {
              label: "Discover Nº 1",
              href: "#"
            },

            secondary: {
              label: "Enter the Maison",
              href: "#"
            }
          }
        }

      ]
    });
  </script>

</body>
</html>
